<!DOCTYPE html>
<html>
<head>
    <title>Game Over</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 80%;
            margin: auto;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .score {
            font-size: 22px;
            margin: 15px 0;
        }

        .stats {
            font-size: 18px;
            margin: 10px 0;
        }

        .rec {
            margin-top: 20px;
            padding: 15px;
            background: #f0f8ff;
            border-radius: 10px;
            text-align: left;
            white-space: pre-line;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007BFF;
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Game Over!</h1>

    <div class="score">
        Your Score: {{ score }} / {{ total }}
    </div>

    <!-- PERFORMANCE BREAKDOWN -->
    <div class="stats">
        Image Detection: {{ image_pct }}%
    </div>

    <div class="stats">
        Manipulation Detection: {{ manip_pct }}%
    </div>

    <div class="stats">
        Misinformation Detection: {{ fake_pct }}%
    </div>

    <hr>

    <h2>Personalised Recommendations</h2>

    <div class="rec">
        {{ recommendation }}
    </div>

    <a href="/">
        <button>Play Again</button>
    </a>

</div>

</body>
</html>
